<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra Exchange Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --navy:#1B3A6B;--navy2:#243F7A;--navy-light:rgba(27,58,107,.08);
  --bg:#F0F4F8;--card:#FFFFFF;--card2:#F7F9FC;
  --border:#DDE3ED;--border2:#C8D2E2;
  --t1:#1B2B4A;--t2:#4A5E80;--t3:#8898B0;
  --up:#22A65E;--dn:#E03050;
  --usd:#3B82F6;--usdb:#7C3AED;--eur:#D97706;--eur5:#DB2777;
  --r:10px;--rcard:14px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hidden{display:none!important}

/* LAYOUT */
.app{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 60px;padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HEADER */
.hdr{text-align:center;margin-bottom:24px}
.hdr-logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.logo-icon{width:40px;height:40px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.logo-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.logo-text{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase}
.logo-text span{font-weight:400}

/* NAV TABS */
.nav{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;gap:3px;margin-bottom:22px;box-shadow:0 1px 4px rgba(27,58,107,.06)}
.nav-btn{flex:1;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--t3);transition:.15s;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.nav-btn.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(27,58,107,.25)}
.nav-btn:not(.on):hover{color:var(--t2);background:var(--navy-light)}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rcard);box-shadow:0 2px 8px rgba(27,58,107,.05);overflow:hidden;margin-bottom:14px}
.card-hd{background:var(--navy);color:#fff;padding:14px 18px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.card-hd-title{font-size:15px;font-weight:700;letter-spacing:-.2px;text-transform:none}

/* PAGE TITLE */
.page-title{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.3px;margin-bottom:16px;text-align:center}

/* CURRENCY TABLE */
.rates-table{width:100%}
.rates-thead{display:grid;grid-template-columns:1fr 100px 100px;background:var(--navy);color:#fff;padding:11px 18px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;gap:10px}
.rates-thead .rt-buy{text-align:center;color:#86EFAC}
.rates-thead .rt-sell{text-align:center;color:#FCA5A5}
.rate-row{display:grid;grid-template-columns:1fr 100px 100px;align-items:center;padding:10px 18px;gap:10px;border-bottom:1px solid var(--border);transition:.1s}
.rate-row:last-child{border-bottom:none}
.rate-row:hover{background:var(--card2)}
.cur-info{display:flex;align-items:center;gap:10px;min-width:0}
.cur-flag{font-size:22px;flex-shrink:0;line-height:1}
.cur-name{font-size:13px;font-weight:600;color:var(--t1)}
.cur-key{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t3);margin-top:1px}
.cur-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:auto}
.rate-inp{width:100%;border:1.5px solid var(--border2);border-radius:8px;padding:8px 10px;font:600 14px 'JetBrains Mono',monospace;color:var(--t1);background:#fff;text-align:center;transition:.15s;-moz-appearance:textfield;outline:none}
.rate-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.rate-inp:focus{border-color:var(--navy);background:rgba(27,58,107,.04)}
.rate-inp::placeholder{color:var(--t3);font-weight:400;font-family:'Inter',sans-serif;font-size:12px}
.rates-footer{padding:12px 18px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);background:var(--card2)}
.rates-footer-note{font-size:11px;color:var(--t3);flex:1}

/* PUBLISH BUTTON */
.btn-publish{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.01em;transition:.15s;margin-top:10px;box-shadow:0 3px 12px rgba(27,58,107,.2)}
.btn-publish:hover:not(:disabled){background:var(--navy2)}
.btn-publish:disabled{opacity:.5;cursor:default;box-shadow:none}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;flex-shrink:0}
.btn-p{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,58,107,.2)}
.btn-p:hover:not(:disabled){background:var(--navy2)}
.btn-p:disabled{opacity:.45;cursor:default}
.btn-g{background:var(--card);color:var(--t2);border:1.5px solid var(--border2)}
.btn-g:hover{background:var(--card2);color:var(--t1)}
.btn-d{color:var(--dn);border:1.5px solid rgba(224,48,80,.2)}
.btn-d:hover{background:rgba(224,48,80,.06)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-ico{padding:5px;width:30px;height:30px}

/* STATUS CHIP */
.chip-wrap{display:flex;justify-content:center;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--t3);font-weight:500;box-shadow:0 1px 3px rgba(27,58,107,.06)}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.chip-dot.ok{background:var(--up);box-shadow:0 0 5px var(--up)}
.chip-dot.err{background:var(--dn)}

/* CHANNELS */
.ch-list{display:flex;flex-direction:column}
.ch-card{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);transition:.1s}
.ch-card:last-child{border-bottom:none}
.ch-card:hover{background:var(--card2)}
.ch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ch-dot.on{background:var(--up);box-shadow:0 0 5px rgba(34,166,94,.4)}.ch-dot.off{background:var(--border2)}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1)}
.ch-id{font:11px/1.4 'JetBrains Mono',monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ch-badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;flex-shrink:0}
.ch-badge.img{background:rgba(59,130,246,.1);color:#2563EB}.ch-badge.txt{background:rgba(34,166,94,.1);color:#16A34A}
.ch-acts{display:flex;gap:4px;flex-shrink:0}
.ch-meta{display:flex;gap:5px;flex-wrap:wrap;width:100%;margin-top:4px}
.ch-meta-item{font-size:10px;color:var(--t2);font-weight:500;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}

/* LOGS */
.log-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.lf-btn{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card);border:1.5px solid var(--border2);color:var(--t3);transition:.15s}
.lf-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lf-btn:hover:not(.on){color:var(--t2)}
.custom-range{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.custom-range input[type=date]{background:var(--card);border:1.5px solid var(--border2);border-radius:7px;color:var(--t2);font:12px 'Inter',sans-serif;padding:6px 9px;outline:none}
.custom-range input[type=date]:focus{border-color:var(--navy)}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rcard);padding:14px;text-align:center;box-shadow:0 1px 4px rgba(27,58,107,.04)}
.stat-val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.stat-lbl{font-size:10px;color:var(--t3);margin-top:3px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* Pie */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--rcard);padding:16px;margin-bottom:14px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 4px rgba(27,58,107,.04)}
#pieCanvas{flex-shrink:0;width:120px;height:120px}
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.pie-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pie-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)}
.pie-tooltip{position:absolute;background:var(--navy);color:#fff;border-radius:7px;padding:5px 10px;font-size:11px;pointer-events:none;z-index:50;white-space:nowrap}

/* Log table */
.log-table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:9px 12px;border-bottom:2px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--t2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card2)}
.status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.status-badge.success{background:rgba(34,166,94,.1);color:#16A34A}
.status-badge.error{background:rgba(224,48,80,.1);color:var(--dn)}
.status-badge.skip{background:rgba(217,119,6,.1);color:#B45309}

/* Pagination */
.pag{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.pag-info{font-size:11px;color:var(--t3)}
.pag-btns{display:flex;gap:4px}

/* Loading / empty */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;color:var(--t3);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.empty{text-align:center;padding:44px;color:var(--t3)}
.empty-ico{font-size:34px;margin-bottom:10px}
.empty-txt{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:3px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,25,50,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;width:min(480px,100%);box-shadow:0 20px 60px rgba(15,25,50,.15);transform:translateY(10px)scale(.97);transition:transform .2s}
.overlay.open .modal{transform:translateY(0)scale(1)}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--navy);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.field input[type=text],.field input[type=number]{width:100%;background:#fff;border:1.5px solid var(--border2);border-radius:8px;color:var(--t1);font-size:13px;font-weight:500;padding:9px 12px;transition:.15s;outline:none;-moz-appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.field input[type=text]:focus,.field input[type=number]:focus{border-color:var(--navy);background:rgba(27,58,107,.03)}
.field input::placeholder{color:var(--t3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-half label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.field-half input{width:100%;background:#fff;border:1.5px solid var(--border2);border-radius:8px;color:var(--t1);font-size:13px;font-weight:500;padding:9px 12px;transition:.15s;outline:none;-moz-appearance:textfield}
.field-half input::-webkit-inner-spin-button{-webkit-appearance:none}
.field-half input:focus{border-color:var(--navy)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg-btn{flex:1;min-width:0;padding:8px 10px;border-radius:7px;border:1.5px solid var(--border2);background:#fff;color:var(--t3);font:500 12px 'Inter',sans-serif;transition:.15s;text-align:center}
.seg-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--navy);color:#fff;border-radius:8px;padding:9px 18px;font-size:12px;font-weight:600;pointer-events:none;z-index:999;opacity:0;transition:.2s;white-space:nowrap;box-shadow:0 6px 20px rgba(27,58,107,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--up)}
#toast.err{background:var(--dn)}
</style>
</head>
<body>
<div class="app">

<header class="hdr">
  <div class="hdr-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L4 7m3-3 3 3M17 8v12m0 0 3-3m-3 3-3-3"/></svg>
    </div>
    <div class="logo-text">Extra <span>Exchange</span></div>
  </div>
</header>

<div class="chip-wrap">
  <div class="chip"><span class="chip-dot" id="dot"></span><span id="dotTxt">Подключение...</span></div>
</div>

<nav class="nav">
  <button class="nav-btn on" data-tab="rates">💸 Курсы</button>
  <button class="nav-btn"    data-tab="channels">📡 Каналы</button>
  <button class="nav-btn"    data-tab="logs">📋 Логи</button>
</nav>

<!-- RATES -->
<div id="pane-rates">
  <div class="page-title">Актуальный курс валют</div>
  <div class="card">
    <div class="rates-thead">
      <div>Валюта</div>
      <div class="rt-buy">Покупка</div>
      <div class="rt-sell">Продажа</div>
    </div>
    <div id="ratesWrap"><div class="loading"><span class="spinner"></span>Загружаем...</div></div>
    <div class="rates-footer">
      <span class="rates-footer-note" id="savedAt"></span>
      <button class="btn btn-g btn-sm" onclick="loadRates()">↺</button>
    </div>
  </div>
  <button class="btn-publish" id="saveBtn" onclick="saveRates()" disabled>Опубликовать</button>
</div>

<!-- CHANNELS -->
<div id="pane-channels" class="hidden">
  <div class="sec-hd">
    <span class="sec-lbl">Каналы рассылки</span>
    <button class="btn btn-p btn-sm" onclick="openModal()">+ Добавить</button>
  </div>
  <div class="card">
    <div class="ch-list" id="chWrap"><div class="loading"><span class="spinner"></span>Загружаем...</div></div>
  </div>
</div>

<!-- LOGS -->
<div id="pane-logs" class="hidden">
  <div class="log-filters" id="logFilters">
    <button class="lf-btn on" data-f="today">Сегодня</button>
    <button class="lf-btn"    data-f="yesterday">Вчера</button>
    <button class="lf-btn"    data-f="30d">30 дней</button>
    <button class="lf-btn"    data-f="all">Всё время</button>
    <button class="lf-btn"    data-f="custom">📅 Период</button>
  </div>
  <div class="custom-range hidden" id="customRange">
    <input type="date" id="dateFrom">
    <span style="color:var(--t3)">—</span>
    <input type="date" id="dateTo">
    <button class="btn btn-p btn-sm" onclick="applyCustom()">Применить</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="st-today">—</div><div class="stat-lbl">Сегодня</div></div>
    <div class="stat-card"><div class="stat-val" id="st-ok">—</div><div class="stat-lbl">Успешно</div></div>
    <div class="stat-card"><div class="stat-val" id="st-err">—</div><div class="stat-lbl">Ошибки</div></div>
  </div>

  <div class="chart-wrap" id="chartWrap" style="display:none">
    <canvas id="pieCanvas" width="120" height="120"></canvas>
    <div class="pie-legend" id="pieLegend"></div>
  </div>
  <div id="pieTooltip" class="pie-tooltip" style="display:none"></div>

  <div class="card">
    <div id="logsWrap"><div class="loading"><span class="spinner"></span>Загружаем логи...</div></div>
  </div>
  <div class="pag hidden" id="pag">
    <span class="pag-info" id="pagInfo"></span>
    <div class="pag-btns">
      <button class="btn btn-g btn-sm" id="pagPrev" onclick="changePage(-1)">← Пред</button>
      <button class="btn btn-g btn-sm" id="pagNext" onclick="changePage(1)">След →</button>
    </div>
  </div>
</div>

</div><!-- /app -->

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-title" id="mTitle">Новый канал</div>
    <input type="hidden" id="rowId">
    <div class="field">
      <label>Название</label>
      <input type="text" id="fName" placeholder="Основной канал">
    </div>
    <div class="field">
      <label>Telegram ID</label>
      <input type="text" id="fId" placeholder="-100123456789">
    </div>
    <div class="field">
      <label>Интервал рассылки (мин)</label>
      <input type="number" id="fInterval" min="1" max="1440" placeholder="60" step="1">
    </div>
    <div class="field field-row">
      <div class="field-half">
        <label>Начало работы (час)</label>
        <input type="number" id="fStart" min="0" max="23" placeholder="9">
      </div>
      <div class="field-half">
        <label>Конец работы (час)</label>
        <input type="number" id="fEnd" min="0" max="23" placeholder="21">
      </div>
    </div>
    <div class="field">
      <label>Тип сообщения</label>
      <div class="seg">
        <button class="seg-btn" id="tImg" onclick="setType('image')">📸 PNG картинка</button>
        <button class="seg-btn on" id="tTxt" onclick="setType('text')">✉️ Текст</button>
      </div>
    </div>
    <div class="field">
      <label>Медиа</label>
      <div class="seg">
        <button class="seg-btn" id="tNomedia" onclick="setNoMedia(true)">Без медиа</button>
        <button class="seg-btn on" id="tMedia" onclick="setNoMedia(false)">С медиа</button>
      </div>
    </div>
    <div class="field">
      <label>Статус</label>
      <div class="seg">
        <button class="seg-btn on" id="tOn"  onclick="setActive(true)">✓ Активен</button>
        <button class="seg-btn"    id="tOff" onclick="setActive(false)">⏸ Отключён</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-g" onclick="closeModal()">Отмена</button>
      <button class="btn btn-p" id="mSave" onclick="saveChannel()">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API='https://n8.migas.studio/webhook';
const CURR={
  USD_NEW:{label:'Доллар белый',flag:'🇺🇸'},
  USD_OLD:{label:'Доллар синий',flag:'🇺🇸'},
  EUR:    {label:'Евро',        flag:'🇪🇺'},
  EUR_500:{label:'500 Евро',    flag:'🇪🇺'},
};
const ORDER=['USD_OLD','USD_NEW','EUR','EUR_500'];

let rates=[],channels=[],dirty=false,_img=false,_active=true,_nomedia=false;
let allLogs=[],logPage=1;const PAGE=100;
let logFilter='today',customFrom='',customTo='';

/* ── Nav ── */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const n=btn.dataset.tab;
    document.querySelectorAll('.nav-btn').forEach(t=>t.classList.toggle('on',t===btn));
    ['rates','channels','logs'].forEach(p=>
      document.getElementById('pane-'+p).classList.toggle('hidden',p!==n));
    if(n==='channels'&&!channels.length)loadChannels();
    if(n==='logs')loadLogs();
  });
});

/* ── Log filters ── */
document.querySelectorAll('.lf-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    logFilter=btn.dataset.f;
    document.querySelectorAll('.lf-btn').forEach(b=>b.classList.toggle('on',b===btn));
    document.getElementById('customRange').classList.toggle('hidden',logFilter!=='custom');
    if(logFilter!=='custom')loadLogs();
  });
});

function applyCustom(){
  customFrom=document.getElementById('dateFrom').value;
  customTo=document.getElementById('dateTo').value;
  if(!customFrom&&!customTo){toast('Выбери хотя бы одну дату','err');return}
  loadLogs();
}

function getDateRange(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  // SeaTable SQL needs "YYYY-MM-DD HH:mm" (space, not T)
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(logFilter==='today'){
    const s=new Date(now); s.setHours(0,0,0,0);
    return{from:fmt(s),to:fmt(now)};
  }
  if(logFilter==='yesterday'){
    const s=new Date(now); s.setDate(s.getDate()-1); s.setHours(0,0,0,0);
    const e=new Date(s); e.setHours(23,59,0,0);
    return{from:fmt(s),to:fmt(e)};
  }
  if(logFilter==='30d'){
    const s=new Date(now); s.setDate(s.getDate()-30); s.setHours(0,0,0,0);
    return{from:fmt(s),to:fmt(now)};
  }
  if(logFilter==='custom'){
    return{from:customFrom?customFrom+' 00:00':'',to:customTo?customTo+' 23:59':''};
  }
  return{from:'',to:''};
}

/* ── Helpers ── */
let _tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`show ${type}`;
  clearTimeout(_tt);_tt=setTimeout(()=>el.className='',2800);
}
function setStatus(ok,txt){
  document.getElementById('dot').className='chip-dot '+(ok?'ok':'err');
  document.getElementById('dotTxt').textContent=txt;
}
async function api(method,path,body,qs){
  let url=`${API}/${path}`;
  if(qs){const p=new URLSearchParams(qs);url+=`?${p}`}
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ── RATES ── */
async function loadRates(){
  document.getElementById('ratesWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем...</div>';
  document.getElementById('saveBtn').disabled=true;
  try{
    const d=await api('GET','xrates');
    rates=d.results||[];
    renderRates();
    setStatus(true,'Онлайн');
  }catch(e){
    document.getElementById('ratesWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
    setStatus(false,'Ошибка');
  }
}
function renderRates(){
  const wrap=document.getElementById('ratesWrap');
  const sorted=ORDER.map(k=>rates.find(r=>r.Name===k)).filter(Boolean);
  dirty=false;
  wrap.innerHTML=sorted.map(r=>{
    const c=CURR[r.Name]||{label:r.Name,flag:'💱',dotColor:'#888'};
    return`<div class="rate-row">
      <div class="cur-info">
        <span class="cur-flag">${c.flag}</span>
        <div>
          <div class="cur-name">${c.label}</div>
          <div class="cur-key">${r.Name}</div>
        </div>
      </div>
      <input class="rate-inp" type="number" step="0.01" min="0" placeholder="Курс"
        data-id="${r._id}" data-f="buy" value="${r.buy_rate??''}" oninput="markDirty()">
      <input class="rate-inp" type="number" step="0.01" min="0" placeholder="Курс"
        data-id="${r._id}" data-f="sell" value="${r.sell_rate??''}" oninput="markDirty()">
    </div>`;
  }).join('');
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('saveBtn').textContent='Опубликовать';
}
function markDirty(){if(!dirty){dirty=true;document.getElementById('saveBtn').textContent='Опубликовать ●'}}
async function saveRates(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='Публикуем...';
  const byId={};
  document.querySelectorAll('.rate-inp').forEach(inp=>{
    if(!byId[inp.dataset.id])byId[inp.dataset.id]={row_id:inp.dataset.id,row:{}};
    byId[inp.dataset.id].row[inp.dataset.f==='buy'?'buy_rate':'sell_rate']=parseFloat(inp.value);
  });
  try{
    await api('POST','xrates',{updates:Object.values(byId)});
    dirty=false;
    const now=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('savedAt').textContent=`Обновлено в ${now}`;
    toast('Курсы опубликованы ✓');
    await loadRates();
  }catch(e){toast('Ошибка: '+e.message,'err');btn.disabled=false;btn.textContent='Опубликовать ●'}
}

/* ── CHANNELS ── */
async function loadChannels(){
  document.getElementById('chWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем...</div>';
  try{
    const d=await api('GET','xchannels');
    channels=d.results||[];
    renderChannels();
  }catch(e){
    document.getElementById('chWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
  }
}
function renderChannels(){
  const wrap=document.getElementById('chWrap');
  if(!channels.length){
    wrap.innerHTML='<div class="empty"><div class="empty-ico">📡</div><div class="empty-txt">Каналов пока нет</div></div>';return;
  }
  wrap.innerHTML=channels.map(ch=>`
    <div class="ch-card">
      <div class="ch-dot ${ch.active?'on':'off'}"></div>
      <div class="ch-info">
        <div class="ch-name">${esc(ch.Name)}</div>
        <div class="ch-id">${esc(ch.channel_id||'—')}</div>
      </div>
      <span class="ch-badge ${ch.send_rates_image?'img':'txt'}">${ch.send_rates_image?'📸 PNG':'✉️ Текст'}</span>
      <div class="ch-acts">
        <button class="btn btn-g btn-sm btn-ico" onclick='editChannel(${JSON.stringify(ch)})' title="Ред.">✎</button>
        <button class="btn btn-d btn-sm btn-ico" onclick="delChannel('${ch._id}','${esc(ch.Name)}')" title="Удал.">✕</button>
      </div>
      <div class="ch-meta">
        <span class="ch-meta-item">⏱ ${ch.interval_minutes||60} мин</span>
        <span class="ch-meta-item">🕐 ${ch.start_hour!=null?ch.start_hour:9}:00–${ch.end_hour!=null?ch.end_hour:21}:00</span>
        ${ch.send_without_media?'<span class="ch-meta-item">без медиа</span>':''}
        ${!ch.active?'<span class="ch-meta-item" style="color:var(--dn)">⏸ отключён</span>':''}
      </div>
    </div>`).join('');
}
function openModal(ch){
  document.getElementById('mTitle').textContent=ch?'Редактировать канал':'Новый канал';
  document.getElementById('rowId').value=ch?._id||'';
  document.getElementById('fName').value=ch?.Name||'';
  document.getElementById('fId').value=ch?.channel_id||'';
  document.getElementById('fInterval').value=ch?.interval_minutes!=null?ch.interval_minutes:60;
  document.getElementById('fStart').value=ch?.start_hour!=null?ch.start_hour:9;
  document.getElementById('fEnd').value=ch?.end_hour!=null?ch.end_hour:21;
  _img=!!ch?.send_rates_image;
  _nomedia=!!ch?.send_without_media;
  _active=ch==null?true:!!ch.active;
  syncSeg();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),50);
}
function editChannel(ch){openModal(ch)}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal()}
function setType(t){_img=t==='image';syncSeg()}
function setActive(v){_active=v;syncSeg()}
function setNoMedia(v){_nomedia=v;syncSeg()}
function syncSeg(){
  document.getElementById('tImg').classList.toggle('on',_img);
  document.getElementById('tTxt').classList.toggle('on',!_img);
  document.getElementById('tNomedia').classList.toggle('on',_nomedia);
  document.getElementById('tMedia').classList.toggle('on',!_nomedia);
  document.getElementById('tOn').classList.toggle('on',_active);
  document.getElementById('tOff').classList.toggle('on',!_active);
}
async function saveChannel(){
  const btn=document.getElementById('mSave');
  const row_id=document.getElementById('rowId').value;
  const name=document.getElementById('fName').value.trim();
  const chId=document.getElementById('fId').value.trim();
  if(!name||!chId){toast('Заполни название и ID','err');return}
  const interval=parseInt(document.getElementById('fInterval').value)||60;
  const startH=parseInt(document.getElementById('fStart').value);
  const endH=parseInt(document.getElementById('fEnd').value);
  btn.disabled=true;btn.textContent='...';
  try{
    await api('POST','xchannels',{
      action:row_id?'update':'create',row_id,name,channel_id:chId,
      send_rates_image:_img,send_without_media:_nomedia,active:_active,note:'',
      interval_minutes:isNaN(interval)?60:interval,
      start_hour:isNaN(startH)?9:startH,
      end_hour:isNaN(endH)?21:endH
    });
    toast(row_id?'Обновлено ✓':'Добавлено ✓');closeModal();await loadChannels();
  }catch(e){toast('Ошибка: '+e.message,'err')}
  finally{btn.disabled=false;btn.textContent='Сохранить'}
}
async function delChannel(id,name){
  if(!confirm(`Удалить «${name}»?`))return;
  try{await api('POST','xchannels',{action:'delete',row_id:id});toast('Удалено');await loadChannels()}
  catch(e){toast('Ошибка: '+e.message,'err')}
}

/* ── LOGS ── */
const PIE_COLORS=['#1B3A6B','#3B82F6','#7C3AED','#D97706','#DB2777','#22A65E','#E03050','#06B6D4'];

async function loadLogs(){
  document.getElementById('logsWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем логи...</div>';
  document.getElementById('pag').classList.add('hidden');
  document.getElementById('chartWrap').style.display='none';
  const range=getDateRange();
  const qs={};
  if(range.from)qs.date_from=range.from;
  if(range.to)qs.date_to=range.to;
  try{
    const d=await api('GET','xlogs',null,qs);
    allLogs=d.results||[];
    logPage=1;
    renderLogStats();
    renderPie();
    renderLogsPage();
  }catch(e){
    document.getElementById('logsWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
  }
}

function renderLogStats(){
  const today=new Date();today.setHours(0,0,0,0);
  let todayCnt=0,okCnt=0,errCnt=0;
  allLogs.forEach(l=>{
    const st=String(l.status||'').toLowerCase();
    if(st==='success')okCnt++;
    if(st==='error')errCnt++;
    if(l.created_at){
      const d=new Date(l.created_at.replace(' ','T'));
      if(d>=today)todayCnt++;
    }
  });
  document.getElementById('st-today').textContent=todayCnt;
  document.getElementById('st-ok').textContent=okCnt;
  document.getElementById('st-err').textContent=errCnt;
}

function renderPie(){
  if(!allLogs.length){document.getElementById('chartWrap').style.display='none';return}
  const counts={};
  allLogs.forEach(l=>{const n=l.channel_name||'?';counts[n]=(counts[n]||0)+1});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=allLogs.length;
  document.getElementById('chartWrap').style.display='flex';
  const canvas=document.getElementById('pieCanvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,120,120);
  let start=-Math.PI/2;
  sorted.forEach(([name,cnt],i)=>{
    const angle=(cnt/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(60,60);
    ctx.arc(60,60,55,start,start+angle);
    ctx.closePath();
    ctx.fillStyle=PIE_COLORS[i%PIE_COLORS.length];
    ctx.fill();
    start+=angle;
  });
  const legend=document.getElementById('pieLegend');
  legend.innerHTML=sorted.map(([name,cnt],i)=>`
    <div class="pie-legend-item">
      <span class="pie-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>
      <span class="pie-count">${cnt}</span>
    </div>`).join('');
  const tooltip=document.getElementById('pieTooltip');
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
    const x=(e.clientX-rect.left)*scaleX-60,y=(e.clientY-rect.top)*scaleY-60;
    const dist=Math.sqrt(x*x+y*y);
    if(dist>55){tooltip.style.display='none';return}
    let angle=Math.atan2(y,x)+Math.PI/2;
    if(angle<0)angle+=Math.PI*2;
    let acc=0,found=null;
    for(const [name,cnt] of sorted){
      acc+=(cnt/total)*Math.PI*2;
      if(angle<=acc){found={name,cnt};break}
    }
    if(!found){tooltip.style.display='none';return}
    tooltip.style.display='block';
    tooltip.style.left=(e.pageX+10)+'px';
    tooltip.style.top=(e.pageY-28)+'px';
    tooltip.textContent=`${found.name}: ${found.cnt}`;
  };
  canvas.onmouseleave=()=>tooltip.style.display='none';
}

function renderLogsPage(){
  const wrap=document.getElementById('logsWrap');
  const pag=document.getElementById('pag');
  if(!allLogs.length){
    wrap.innerHTML='<div class="empty"><div class="empty-ico">📋</div><div class="empty-txt">Логов нет за этот период</div></div>';
    pag.classList.add('hidden');return;
  }
  const total=allLogs.length;
  const pages=Math.ceil(total/PAGE);
  const slice=allLogs.slice((logPage-1)*PAGE,logPage*PAGE);
  wrap.innerHTML=`<div class="log-table-wrap"><table>
    <thead><tr>
      <th>Время (МСК)</th><th>Канал</th><th>Статус</th><th>Тип</th><th>Ошибка</th>
    </tr></thead>
    <tbody>${slice.map(l=>{
      const st=String(l.status||'').toLowerCase();
      const dt=l.created_at?fmtMsk(l.created_at):'—';
      return`<tr>
        <td style="font:11px/1 'JetBrains Mono',monospace;white-space:nowrap;color:var(--t1)">${dt}</td>
        <td style="font-weight:600;color:var(--t1)">${esc(l.channel_name||'?')}</td>
        <td><span class="status-badge ${st}">${esc(l.status||'?')}</span></td>
        <td>${esc(l.type||'—')}</td>
        <td style="color:var(--dn);font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.error_message||'')}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  const pagInfo=document.getElementById('pagInfo');
  pagInfo.textContent=`${(logPage-1)*PAGE+1}–${Math.min(logPage*PAGE,total)} из ${total}`;
  document.getElementById('pagPrev').disabled=logPage<=1;
  document.getElementById('pagNext').disabled=logPage>=pages;
  pag.classList.toggle('hidden',pages<=1);
}

function changePage(d){logPage+=d;renderLogsPage();window.scrollTo(0,0)}

function fmtMsk(s){
  try{
    const str=s.includes('T')?s:s.replace(' ','T');
    const d=new Date(str.includes('+')||str.includes('Z')?str:str+'Z');
    // If already has timezone info, use directly; otherwise assume UTC and add 3h
    const hasTZ=str.includes('+')&&!str.endsWith('+');
    const dt=hasTZ?new Date(str):new Date(d.getTime()+3*3600000);
    const pad=n=>String(n).padStart(2,'0');
    return`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  }catch{return s}
}

loadRates();
