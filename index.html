<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra Exchange Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#06090F;--bg1:#0B0F18;--bg2:#111827;--bg3:#1A2233;
  --br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.12);
  --t1:#F8FAFF;--t2:#B0BECF;--t3:#637384;
  --a:#3E7BFA;--ag:rgba(62,123,250,.35);
  --up:#22C55E;--dn:#F43F5E;
  --usdw:#3B82F6;--usdb:#8B5CF6;--eur:#F59E0B;--eur5:#EC4899;
  --rsm:8px;--rmd:12px;--rlg:16px;--rxl:20px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hidden{display:none!important}

.app{max-width:720px;margin:0 auto;padding:36px max(16px,env(safe-area-inset-left,0px)) 80px;padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HEADER */
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.hdr-logo{position:relative;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1D4ED8,#7C3AED);display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:0 6px 24px var(--ag)}
.hdr-logo::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%)}
.hdr-body{flex:1;min-width:0}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.hdr-sub{font-size:12px;color:var(--t3);margin-top:2px}
.hdr-st{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);font-weight:500;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--br);flex-shrink:0}
.st-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);transition:.3s}
.st-dot.ok{background:var(--up);box-shadow:0 0 5px var(--up)}
.st-dot.err{background:var(--dn)}

/* TABS */
.tabs{display:flex;gap:3px;padding:3px;background:var(--bg1);border:1px solid var(--br);border-radius:var(--rlg);margin-bottom:24px}
.tab{flex:1;padding:9px 12px;border-radius:var(--rmd);font-size:12px;font-weight:600;color:var(--t3);transition:.15s}
.tab.on{background:var(--bg3);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.tab:not(.on):hover{color:var(--t2)}

/* SECTION */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}

/* CURRENCY CARDS */
.cc-list{display:flex;flex-direction:column;gap:5px}
.cc{position:relative;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:0 12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--br);border-radius:var(--rlg);overflow:hidden;transition:border-color .2s}
.cc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--rlg) 0 0 var(--rlg)}
.cc.usdw::before{background:var(--usdw)}.cc.usdb::before{background:var(--usdb)}.cc.eur::before{background:var(--eur)}.cc.eur5::before{background:var(--eur5)}
.cc:focus-within{border-color:var(--br2)}
.cc-icon{width:38px;height:38px;border-radius:var(--rsm);display:grid;place-items:center;font-size:18px}
.cc.usdw .cc-icon{background:rgba(59,130,246,.12)}.cc.usdb .cc-icon{background:rgba(139,92,246,.12)}.cc.eur .cc-icon{background:rgba(245,158,11,.12)}.cc.eur5 .cc-icon{background:rgba(236,72,153,.12)}
.cc-name{font-size:13px;font-weight:600}.cc-key{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--t3);margin-top:2px}
.rate-pair{display:flex;gap:7px;align-items:center}
.rf{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.rl.buy{color:var(--up)}.rl.sell{color:var(--dn)}
.ri{width:80px;background:var(--bg1);border:1px solid var(--br);border-radius:var(--rsm);color:var(--t1);font:600 14px/1 'JetBrains Mono',monospace;padding:6px 8px;text-align:right;transition:.15s;-moz-appearance:textfield}
.ri::-webkit-inner-spin-button{-webkit-appearance:none}
.ri:focus{outline:none;border-color:var(--a);background:rgba(62,123,250,.06)}
.rsep{width:1px;height:34px;background:var(--br);flex-shrink:0}

.rfooter{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--br)}
.rfooter-note{font-size:11px;color:var(--t3);flex:1;min-width:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 18px;border-radius:var(--rmd);font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;flex-shrink:0}
.btn-p{background:var(--a);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 3px 12px var(--ag)}
.btn-p:hover:not(:disabled){background:#5089FB}
.btn-p:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-g{background:var(--bg2);color:var(--t2);border:1px solid var(--br2)}
.btn-g:hover{color:var(--t1);background:var(--bg3)}
.btn-d{color:var(--dn);border:1px solid rgba(244,63,94,.25)}
.btn-d:hover{background:rgba(244,63,94,.1)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:var(--rsm)}
.btn-ico{padding:4px;width:28px;height:28px}

/* CHANNELS */
.ch-list{display:flex;flex-direction:column;gap:5px}
.ch-card:hover{border-color:var(--br2)}
.ch-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ch-dot.on{background:var(--up);box-shadow:0 0 6px var(--up)}.ch-dot.off{background:var(--bg3)}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-id{font:11px/1.4 'JetBrains Mono',monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ch-badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex-shrink:0}
.ch-badge.img{background:rgba(59,130,246,.12);color:#60A5FA}.ch-badge.txt{background:rgba(34,197,94,.1);color:#4ADE80}
.ch-acts{display:flex;gap:3px;flex-shrink:0}
.ch-meta{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;margin-top:5px;padding-top:5px;border-top:1px solid var(--br)}
.ch-meta-item{font-size:10px;color:var(--t3);font-weight:500;background:var(--bg1);border:1px solid var(--br);border-radius:4px;padding:2px 7px}
.ch-meta-muted{color:var(--t3);opacity:.6}
.ch-card{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--br);border-radius:var(--rlg);transition:border-color .15s}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-half label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.field-half input{width:100%;background:var(--bg1);border:1px solid var(--br2);border-radius:var(--rsm);color:var(--t1);font-size:13px;font-weight:500;padding:9px 11px;transition:.15s;-moz-appearance:textfield}
.field-half input::-webkit-inner-spin-button{-webkit-appearance:none}
.field-half input:focus{outline:none;border-color:var(--a);background:rgba(62,123,250,.06)}
.field input[type=number]{width:100%;background:var(--bg1);border:1px solid var(--br2);border-radius:var(--rsm);color:var(--t1);font-size:13px;font-weight:500;padding:9px 11px;transition:.15s;-moz-appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.field input[type=number]:focus{outline:none;border-color:var(--a);background:rgba(62,123,250,.06)}

/* LOGS */
.log-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.lf-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--br2);color:var(--t3);transition:.15s}
.lf-btn.on{background:rgba(62,123,250,.12);border-color:rgba(62,123,250,.4);color:var(--t1)}
.lf-btn:hover:not(.on){color:var(--t2)}
.custom-range{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.custom-range input[type=date]{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--rsm);color:var(--t2);font:12px 'Inter',sans-serif;padding:5px 8px;colorscheme:dark}
.custom-range input[type=date]:focus{outline:none;border-color:var(--a)}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--br);border-radius:var(--rlg);padding:12px 14px;text-align:center}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat-lbl{font-size:10px;color:var(--t3);margin-top:3px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* Pie chart */
.chart-wrap{background:var(--bg2);border:1px solid var(--br);border-radius:var(--rlg);padding:16px;margin-bottom:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
#pieCanvas{flex-shrink:0;width:120px;height:120px}
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.pie-legend-item{display:flex;align-items:center;gap:7px;font-size:12px}
.pie-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pie-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)}
.pie-tooltip{position:absolute;background:var(--bg3);border:1px solid var(--br2);border-radius:var(--rsm);padding:5px 10px;font-size:11px;pointer-events:none;z-index:50;white-space:nowrap}

/* Logs table */
.log-table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--br)}
td{padding:8px 10px;border-bottom:1px solid var(--br);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.status-badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.status-badge.success{background:rgba(34,197,94,.1);color:#4ADE80}
.status-badge.error{background:rgba(244,63,94,.1);color:var(--dn)}
.status-badge.skip{background:rgba(245,158,11,.1);color:#FCD34D}

/* Pagination */
.pag{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--br)}
.pag-info{font-size:11px;color:var(--t3)}
.pag-btns{display:flex;gap:4px}

/* Loading / empty */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:36px;color:var(--t3);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid var(--br2);border-top-color:var(--a);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.empty{text-align:center;padding:40px;color:var(--t3)}
.empty-ico{font-size:32px;margin-bottom:10px}
.empty-txt{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:3px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:1px solid var(--br2);border-radius:var(--rxl);padding:26px;width:min(460px,100%);box-shadow:0 32px 80px rgba(0,0,0,.7);transform:translateY(8px)scale(.97);transition:transform .2s}
.overlay.open .modal{transform:translateY(0)scale(1)}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.field input[type=text]{width:100%;background:var(--bg1);border:1px solid var(--br2);border-radius:var(--rsm);color:var(--t1);font-size:13px;font-weight:500;padding:9px 11px;transition:.15s}
.field input[type=text]:focus{outline:none;border-color:var(--a);background:rgba(62,123,250,.06)}
.field input[type=text]::placeholder{color:var(--t3)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg-btn{flex:1;min-width:0;padding:8px 10px;border-radius:var(--rsm);border:1px solid var(--br2);background:var(--bg1);color:var(--t3);font:500 12px 'Inter',sans-serif;transition:.15s;text-align:center}
.seg-btn.on{background:rgba(62,123,250,.12);border-color:rgba(62,123,250,.4);color:var(--t1)}
.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:22px;padding-top:18px;border-top:1px solid var(--br)}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--bg3);border:1px solid var(--br2);border-radius:var(--rmd);padding:8px 16px;font-size:12px;font-weight:500;pointer-events:none;z-index:999;opacity:0;transition:.2s;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(34,197,94,.35);color:var(--up)}
#toast.err{border-color:rgba(244,63,94,.35);color:var(--dn)}
</style>
</head>
<body>
<div class="app">

<header class="hdr">
  <div class="hdr-logo">💱</div>
  <div class="hdr-body">
    <h1 class="hdr-title">Extra Exchange</h1>
    <p class="hdr-sub">Управление курсами, каналами и логами рассылки</p>
  </div>
  <div class="hdr-st">
    <span class="st-dot" id="dot"></span>
    <span id="dotTxt">—</span>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="rates">💸 Курсы</button>
  <button class="tab"    data-tab="channels">📡 Каналы</button>
  <button class="tab"    data-tab="logs">📋 Логи</button>
</div>

<!-- RATES -->
<div id="pane-rates">
  <div class="sec-hd"><span class="sec-lbl">Текущие курсы обмена</span></div>
  <div class="cc-list" id="ratesWrap"><div class="loading"><span class="spinner"></span>Загружаем...</div></div>
  <div class="rfooter">
    <span class="rfooter-note" id="savedAt"></span>
    <button class="btn btn-g btn-sm" onclick="loadRates()">↺</button>
    <button class="btn btn-p" id="saveBtn" onclick="saveRates()" disabled>Сохранить</button>
  </div>
</div>

<!-- CHANNELS -->
<div id="pane-channels" class="hidden">
  <div class="sec-hd">
    <span class="sec-lbl">Каналы рассылки</span>
    <button class="btn btn-p btn-sm" onclick="openModal()">+ Добавить</button>
  </div>
  <div class="ch-list" id="chWrap"><div class="loading"><span class="spinner"></span>Загружаем...</div></div>
</div>

<!-- LOGS -->
<div id="pane-logs" class="hidden">
  <div class="log-filters" id="logFilters">
    <button class="lf-btn on" data-f="today">Сегодня</button>
    <button class="lf-btn"    data-f="yesterday">Вчера</button>
    <button class="lf-btn"    data-f="30d">30 дней</button>
    <button class="lf-btn"    data-f="all">Всё время</button>
    <button class="lf-btn"    data-f="custom">📅 Период</button>
  </div>
  <div class="custom-range hidden" id="customRange">
    <input type="date" id="dateFrom">
    <span style="color:var(--t3)">—</span>
    <input type="date" id="dateTo">
    <button class="btn btn-p btn-sm" onclick="applyCustom()">Применить</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="st-today">—</div><div class="stat-lbl">Сегодня</div></div>
    <div class="stat-card"><div class="stat-val" id="st-ok">—</div><div class="stat-lbl">Успешно</div></div>
    <div class="stat-card"><div class="stat-val" id="st-err">—</div><div class="stat-lbl">Ошибки</div></div>
  </div>

  <!-- Pie chart -->
  <div class="chart-wrap" id="chartWrap" style="display:none">
    <canvas id="pieCanvas" width="120" height="120"></canvas>
    <div class="pie-legend" id="pieLegend"></div>
  </div>
  <div id="pieTooltip" class="pie-tooltip" style="display:none"></div>

  <!-- Table -->
  <div id="logsWrap"><div class="loading"><span class="spinner"></span>Загружаем логи...</div></div>
  <div class="pag hidden" id="pag">
    <span class="pag-info" id="pagInfo"></span>
    <div class="pag-btns">
      <button class="btn btn-g btn-sm" id="pagPrev" onclick="changePage(-1)">← Пред</button>
      <button class="btn btn-g btn-sm" id="pagNext" onclick="changePage(1)">След →</button>
    </div>
  </div>
</div>

</div><!-- /app -->

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-title" id="mTitle">Новый канал</div>
    <input type="hidden" id="rowId">
    <div class="field">
      <label>Название</label>
      <input type="text" id="fName" placeholder="Основной канал">
    </div>
    <div class="field">
      <label>Telegram ID или ссылка</label>
      <input type="text" id="fId" placeholder="-100123456789 или https://t.me/+…">
    </div>
    <div class="field">
      <label>Интервал рассылки (мин)</label>
      <input type="number" id="fInterval" min="1" max="1440" placeholder="60" step="1">
    </div>
    <div class="field field-row">
      <div class="field-half">
        <label>Начало работы (час)</label>
        <input type="number" id="fStart" min="0" max="23" placeholder="9">
      </div>
      <div class="field-half">
        <label>Конец работы (час)</label>
        <input type="number" id="fEnd" min="0" max="23" placeholder="21">
      </div>
    </div>
    <div class="field">
      <label>Тип сообщения</label>
      <div class="seg">
        <button class="seg-btn" id="tImg" onclick="setType('image')">📸 Картинка PNG</button>
        <button class="seg-btn on" id="tTxt" onclick="setType('text')">✉️ Текст</button>
      </div>
    </div>
    <div class="field">
      <label>Только текст (без медиа)</label>
      <div class="seg">
        <button class="seg-btn" id="tNomedia" onclick="setNoMedia(true)">✓ Без медиа</button>
        <button class="seg-btn on" id="tMedia" onclick="setNoMedia(false)">📎 С медиа</button>
      </div>
    </div>
    <div class="field">
      <label>Статус</label>
      <div class="seg">
        <button class="seg-btn on" id="tOn"  onclick="setActive(true)">✓ Активен</button>
        <button class="seg-btn"    id="tOff" onclick="setActive(false)">⏸ Отключён</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-g" onclick="closeModal()">Отмена</button>
      <button class="btn btn-p" id="mSave" onclick="saveChannel()">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API='https://n8.migas.studio/webhook';
const CURR={
  USD_NEW:{label:'Доллар белый',icon:'💵',cls:'usdw'},
  USD_OLD:{label:'Доллар синий',icon:'💵',cls:'usdb'},
  EUR:    {label:'Евро',        icon:'💶',cls:'eur'},
  EUR_500:{label:'Евро (500)',  icon:'💶',cls:'eur5'},
};
const ORDER=['USD_NEW','USD_OLD','EUR','EUR_500'];

let rates=[],channels=[],dirty=false,_img=false,_active=true,_nomedia=false;
let allLogs=[],logPage=1;const PAGE=100;
let logFilter='today',customFrom='',customTo='';

/* ── Tabs ── */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const n=btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===btn));
    ['rates','channels','logs'].forEach(p=>
      document.getElementById('pane-'+p).classList.toggle('hidden',p!==n));
    if(n==='channels'&&!channels.length)loadChannels();
    if(n==='logs')loadLogs();
  });
});

/* ── Log filters ── */
document.querySelectorAll('.lf-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    logFilter=btn.dataset.f;
    document.querySelectorAll('.lf-btn').forEach(b=>b.classList.toggle('on',b===btn));
    document.getElementById('customRange').classList.toggle('hidden',logFilter!=='custom');
    if(logFilter!=='custom')loadLogs();
  });
});

function applyCustom(){
  customFrom=document.getElementById('dateFrom').value;
  customTo=document.getElementById('dateTo').value;
  if(!customFrom&&!customTo){toast('Выбери хотя бы одну дату','err');return}
  loadLogs();
}

function getDateRange(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if(logFilter==='today'){
    const s=new Date(now); s.setHours(0,0,0,0);
    return{from:fmt(s),to:fmt(now)};
  }
  if(logFilter==='yesterday'){
    const s=new Date(now); s.setDate(s.getDate()-1); s.setHours(0,0,0,0);
    const e=new Date(s); e.setHours(23,59,59,0);
    return{from:fmt(s),to:fmt(e)};
  }
  if(logFilter==='30d'){
    const s=new Date(now); s.setDate(s.getDate()-30); s.setHours(0,0,0,0);
    return{from:fmt(s),to:fmt(now)};
  }
  if(logFilter==='custom'){
    return{from:customFrom?customFrom+'T00:00:00':'',to:customTo?customTo+'T23:59:59':''};
  }
  return{from:'',to:''};
}

/* ── Helpers ── */
let _tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`show ${type}`;
  clearTimeout(_tt);_tt=setTimeout(()=>el.className='',2800);
}
function setStatus(ok,txt){
  document.getElementById('dot').className='st-dot '+(ok?'ok':'err');
  document.getElementById('dotTxt').textContent=txt;
}
async function api(method,path,body,qs){
  let url=`${API}/${path}`;
  if(qs){const p=new URLSearchParams(qs);url+=`?${p}`}
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ── RATES ── */
async function loadRates(){
  document.getElementById('ratesWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем...</div>';
  document.getElementById('saveBtn').disabled=true;
  try{
    const d=await api('GET','xrates');
    rates=d.results||[];
    renderRates();
    setStatus(true,'Онлайн');
  }catch(e){
    document.getElementById('ratesWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
    setStatus(false,'Ошибка');
  }
}
function renderRates(){
  const wrap=document.getElementById('ratesWrap');
  const sorted=ORDER.map(k=>rates.find(r=>r.Name===k)).filter(Boolean);
  dirty=false;
  wrap.innerHTML=sorted.map(r=>{
    const c=CURR[r.Name]||{label:r.Name,icon:'💱',cls:''};
    return`<div class="cc ${c.cls}">
      <div class="cc-icon">${c.icon}</div>
      <div><div class="cc-name">${c.label}</div><div class="cc-key">${r.Name}</div></div>
      <div class="rate-pair">
        <div class="rf"><span class="rl buy">Покупка</span>
          <input class="ri" type="number" step="0.01" min="0" data-id="${r._id}" data-f="buy" value="${r.buy_rate??''}" oninput="markDirty()">
        </div>
        <div class="rsep"></div>
        <div class="rf"><span class="rl sell">Продажа</span>
          <input class="ri" type="number" step="0.01" min="0" data-id="${r._id}" data-f="sell" value="${r.sell_rate??''}" oninput="markDirty()">
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('saveBtn').textContent='Сохранить';
}
function markDirty(){if(!dirty){dirty=true;document.getElementById('saveBtn').textContent='Сохранить ●'}}
async function saveRates(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='Сохраняем...';
  const byId={};
  document.querySelectorAll('.ri').forEach(inp=>{
    if(!byId[inp.dataset.id])byId[inp.dataset.id]={row_id:inp.dataset.id,row:{}};
    byId[inp.dataset.id].row[inp.dataset.f==='buy'?'buy_rate':'sell_rate']=parseFloat(inp.value);
  });
  try{
    await api('POST','xrates',{updates:Object.values(byId)});
    dirty=false;
    const now=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('savedAt').textContent=`Сохранено в ${now}`;
    toast('Курсы обновлены ✓');
    await loadRates();
  }catch(e){toast('Ошибка: '+e.message,'err');btn.disabled=false;btn.textContent='Сохранить ●'}
}

/* ── CHANNELS ── */
async function loadChannels(){
  document.getElementById('chWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем...</div>';
  try{
    const d=await api('GET','xchannels');
    channels=d.results||[];
    renderChannels();
  }catch(e){
    document.getElementById('chWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
  }
}
function renderChannels(){
  const wrap=document.getElementById('chWrap');
  if(!channels.length){
    wrap.innerHTML='<div class="empty"><div class="empty-ico">📡</div><div class="empty-txt">Каналов пока нет</div></div>';return;
  }
  wrap.innerHTML=channels.map(ch=>`
    <div class="ch-card">
      <div class="ch-dot ${ch.active?'on':'off'}"></div>
      <div class="ch-info">
        <div class="ch-name">${esc(ch.Name)}</div>
        <div class="ch-id">${esc(ch.channel_id||'—')}</div>
      </div>
      <span class="ch-badge ${ch.send_rates_image?'img':'txt'}">${ch.send_rates_image?'📸 PNG':'✉️ Текст'}</span>
      <div class="ch-acts">
        <button class="btn btn-g btn-sm btn-ico" onclick='editChannel(${JSON.stringify(ch)})' title="Ред.">✎</button>
        <button class="btn btn-d btn-sm btn-ico" onclick="delChannel('${ch._id}','${esc(ch.Name)}')" title="Удал.">✕</button>
      </div>
      <div class="ch-meta">
        <span class="ch-meta-item" title="Интервал рассылки">⏱ ${ch.interval_minutes||60} мин</span>
        <span class="ch-meta-item" title="Время работы">🕐 ${ch.start_hour!=null?ch.start_hour:9}:00–${ch.end_hour!=null?ch.end_hour:21}:00</span>
        ${ch.send_without_media?'<span class="ch-meta-item ch-meta-muted">без медиа</span>':''}
      </div>
    </div>`).join('');
}
function openModal(ch){
  document.getElementById('mTitle').textContent=ch?'Редактировать':'Новый канал';
  document.getElementById('rowId').value=ch?._id||'';
  document.getElementById('fName').value=ch?.Name||'';
  document.getElementById('fId').value=ch?.channel_id||'';
  document.getElementById('fInterval').value=ch?.interval_minutes!=null?ch.interval_minutes:60;
  document.getElementById('fStart').value=ch?.start_hour!=null?ch.start_hour:9;
  document.getElementById('fEnd').value=ch?.end_hour!=null?ch.end_hour:21;
  _img=!!ch?.send_rates_image;
  _nomedia=!!ch?.send_without_media;
  _active=ch==null?true:!!ch.active;
  syncSeg();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),50);
}
function editChannel(ch){openModal(ch)}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal()}
function setType(t){_img=t==='image';syncSeg()}
function setActive(v){_active=v;syncSeg()}
function setNoMedia(v){_nomedia=v;syncSeg()}
function syncSeg(){
  document.getElementById('tImg').classList.toggle('on',_img);
  document.getElementById('tTxt').classList.toggle('on',!_img);
  document.getElementById('tNomedia').classList.toggle('on',_nomedia);
  document.getElementById('tMedia').classList.toggle('on',!_nomedia);
  document.getElementById('tOn').classList.toggle('on',_active);
  document.getElementById('tOff').classList.toggle('on',!_active);
}
async function saveChannel(){
  const btn=document.getElementById('mSave');
  const row_id=document.getElementById('rowId').value;
  const name=document.getElementById('fName').value.trim();
  const chId=document.getElementById('fId').value.trim();
  if(!name||!chId){toast('Заполни название и ID','err');return}
  const interval=parseInt(document.getElementById('fInterval').value)||60;
  const startH=parseInt(document.getElementById('fStart').value);
  const endH=parseInt(document.getElementById('fEnd').value);
  btn.disabled=true;btn.textContent='...';
  try{
    await api('POST','xchannels',{
      action:row_id?'update':'create',row_id,name,channel_id:chId,
      send_rates_image:_img,send_without_media:_nomedia,active:_active,note:'',
      interval_minutes:isNaN(interval)?60:interval,
      start_hour:isNaN(startH)?9:startH,
      end_hour:isNaN(endH)?21:endH
    });
    toast(row_id?'Обновлено ✓':'Добавлено ✓');closeModal();await loadChannels();
  }catch(e){toast('Ошибка: '+e.message,'err')}
  finally{btn.disabled=false;btn.textContent='Сохранить'}
}
async function delChannel(id,name){
  if(!confirm(`Удалить «${name}»?`))return;
  try{await api('POST','xchannels',{action:'delete',row_id:id});toast('Удалено');await loadChannels()}
  catch(e){toast('Ошибка: '+e.message,'err')}
}

/* ── LOGS ── */
const PIE_COLORS=['#3B82F6','#8B5CF6','#F59E0B','#EC4899','#22C55E','#F43F5E','#06B6D4','#A3E635'];

async function loadLogs(){
  document.getElementById('logsWrap').innerHTML='<div class="loading"><span class="spinner"></span>Загружаем логи...</div>';
  document.getElementById('pag').classList.add('hidden');
  document.getElementById('chartWrap').style.display='none';
  const range=getDateRange();
  const qs={};
  if(range.from)qs.date_from=range.from;
  if(range.to)qs.date_to=range.to;
  try{
    const d=await api('GET','xlogs',null,qs);
    allLogs=d.results||[];
    logPage=1;
    renderLogStats();
    renderPie();
    renderLogsPage();
  }catch(e){
    document.getElementById('logsWrap').innerHTML=`<div class="loading" style="color:var(--dn)">Ошибка: ${e.message}</div>`;
  }
}

function renderLogStats(){
  const today=new Date();today.setHours(0,0,0,0);
  let todayCnt=0,okCnt=0,errCnt=0;
  allLogs.forEach(l=>{
    const st=String(l.status||'').toLowerCase();
    if(st==='success')okCnt++;
    if(st==='error')errCnt++;
    if(l.created_at){
      const d=new Date(l.created_at.replace(' ','T'));
      if(d>=today)todayCnt++;
    }
  });
  document.getElementById('st-today').textContent=todayCnt;
  document.getElementById('st-ok').textContent=okCnt;
  document.getElementById('st-err').textContent=errCnt;
}

function renderPie(){
  if(!allLogs.length){document.getElementById('chartWrap').style.display='none';return}
  // count by channel
  const counts={};
  allLogs.forEach(l=>{const n=l.channel_name||'?';counts[n]=(counts[n]||0)+1});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=allLogs.length;
  document.getElementById('chartWrap').style.display='flex';

  // draw pie
  const canvas=document.getElementById('pieCanvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,120,120);
  let start=-Math.PI/2;
  sorted.forEach(([name,cnt],i)=>{
    const angle=(cnt/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(60,60);
    ctx.arc(60,60,55,start,start+angle);
    ctx.closePath();
    ctx.fillStyle=PIE_COLORS[i%PIE_COLORS.length];
    ctx.fill();
    start+=angle;
  });

  // legend
  const legend=document.getElementById('pieLegend');
  legend.innerHTML=sorted.map(([name,cnt],i)=>`
    <div class="pie-legend-item">
      <span class="pie-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>
      <span class="pie-count">${cnt}</span>
    </div>`).join('');

  // tooltip on hover
  const tooltip=document.getElementById('pieTooltip');
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
    const x=(e.clientX-rect.left)*scaleX-60,y=(e.clientY-rect.top)*scaleY-60;
    const dist=Math.sqrt(x*x+y*y);
    if(dist>55){tooltip.style.display='none';return}
    let angle=Math.atan2(y,x)+Math.PI/2;
    if(angle<0)angle+=Math.PI*2;
    let acc=0,found=null;
    for(const [name,cnt] of sorted){
      acc+=(cnt/total)*Math.PI*2;
      if(angle<=acc){found={name,cnt};break}
    }
    if(!found){tooltip.style.display='none';return}
    tooltip.style.display='block';
    tooltip.style.left=(e.pageX+10)+'px';
    tooltip.style.top=(e.pageY-28)+'px';
    tooltip.textContent=`${found.name}: ${found.cnt}`;
  };
  canvas.onmouseleave=()=>tooltip.style.display='none';
}

function renderLogsPage(){
  const wrap=document.getElementById('logsWrap');
  const pag=document.getElementById('pag');
  if(!allLogs.length){
    wrap.innerHTML='<div class="empty"><div class="empty-ico">📋</div><div class="empty-txt">Логов нет за этот период</div></div>';
    pag.classList.add('hidden');return;
  }
  const total=allLogs.length;
  const pages=Math.ceil(total/PAGE);
  const slice=allLogs.slice((logPage-1)*PAGE,logPage*PAGE);

  wrap.innerHTML=`<div class="log-table-wrap"><table>
    <thead><tr>
      <th>Время (МСК)</th><th>Канал</th><th>Статус</th><th>Тип</th><th>Ошибка</th>
    </tr></thead>
    <tbody>${slice.map(l=>{
      const st=String(l.status||'').toLowerCase();
      const dt=l.created_at?fmtMsk(l.created_at):'—';
      return`<tr>
        <td style="font:11px/1 'JetBrains Mono',monospace;white-space:nowrap">${dt}</td>
        <td>${esc(l.channel_name||'?')}</td>
        <td><span class="status-badge ${st}">${esc(l.status||'?')}</span></td>
        <td style="color:var(--t3)">${esc(l.type||'—')}</td>
        <td style="color:var(--dn);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.error_message||'')}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;

  // pagination
  const pagInfo=document.getElementById('pagInfo');
  pagInfo.textContent=`${(logPage-1)*PAGE+1}–${Math.min(logPage*PAGE,total)} из ${total}`;
  document.getElementById('pagPrev').disabled=logPage<=1;
  document.getElementById('pagNext').disabled=logPage>=pages;
  pag.classList.toggle('hidden',pages<=1);
}

function changePage(d){logPage+=d;renderLogsPage();window.scrollTo(0,0)}

function fmtMsk(s){
  try{
    // SeaTable returns UTC, add 3h for MSK
    const d=new Date(s.replace(' ','T')+'Z');
    d.setHours(d.getHours()+3);
    const pad=n=>String(n).padStart(2,'0');
    return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }catch{return s}
}

loadRates();
</script>
